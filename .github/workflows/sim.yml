name: sim-smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Regression tests (simulation only)
        run: python tests/test_smoke.py
      - name: DAQ simulate
        run: python3 tt_brown_lab_run.py --backend sim --dwell 0.1 --out tt_brown_runs
      - name: Analyze
        shell: python
        run: |
          import glob, subprocess, sys
          csv = sorted(glob.glob("tt_brown_runs/run_*.csv"))[-1]
          subprocess.run([sys.executable, "tt_brown_analyze.py", "--csv", csv, "--out", "tt_brown_analysis", "--floor-N", "1e-8"], check=True)
      - name: Show verdict
        shell: python
        run: |
          import json
          with open("tt_brown_analysis/analysis_report.json", encoding="utf-8") as handle:
              report = json.load(handle)
          print(json.dumps(report["verdict"]))
